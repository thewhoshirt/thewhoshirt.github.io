<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
    
    <!-- style sheets -->
    <link rel="stylesheet" href="./styles/contacts.css">
    <link rel="stylesheet" href="./scripts/jquery-ui-1.14.1.custom-GR/jquery-ui.css">

    <!-- Animation Plugin -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <!-- jQuery Validation Plugin -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryvalidate/1.19.5/jquery.validate.min.js"></script>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="./scripts/jquery-ui-1.14.1.custom-GR/jquery-ui.js"></script>
    <script src="./scripts/contacts.js"></script>
    
</head>  
<body>
    <header class="topNav">
        <a href="./index.html">Home</a>
        <a href="./education.html">Culinary Experience</a>
        <a href="./experience.html">TV Experience</a>
        <a href="#">Contact Me</a>
        <a href="./referenceList.html">References</a>
        <a href="#" id="theme">Dark/Light</a>
    </header>
    
    <main>
        <Section>
            <h1 class="animate__animated animate__slideInLeft"> Contact Or Visit Me</h1>
            <img src="./images/whiskLightMode.png" class="whisk" id="lightMode">
            <img src="./images/whiskDarkMode.png" class="whisk" id="darkMode">
        </Section>

        <form id="contactForm" class="animate__animated animate__slideInRight">
            <h2>Send Me A Message!</h2>

            <label for="name">Name:</label>
            <br>
            <input type="text" id="name" name="name" required minlength="3">
            <br>
            <label for="email">Email:</label>
            <br>
            <input type="email" id="email" name="email" required>
            <br>
            <label for="phone">Phone Number:</label>
            <br>
            <input type="text" id="phone" name="phone" required minlength="10" maxlength="10">
            <br>
            <label for="comment">Message:</label>
            <br>
            <textarea id="comment" name="comment" required></textarea>
            <br>
            <input type="submit"></input>
            <input type="reset"></input>
        </form>
        
        <section class="animate__animated animate__slideInLeft">
            <h3>Try Some of My Restaurants Around London</h3>
           
            <div id="map"> </div>
        </section>
        <br>
        <br>

        <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDqG5H4vZjkM47VGI56V2BRovyKK0AfRgk&callback=initMap"></script>

    </main>
    <footer>
        <div class="footer"> Footer &copy; Copyright 2025 </div>
    </footer>
    
</body>
</html>
