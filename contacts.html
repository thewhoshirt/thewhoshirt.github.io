<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
    <link rel="stylesheet" href="./styles/contacts.css">

    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <!-- jQuery Validation Plugin -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryvalidate/1.19.5/jquery.validate.min.js"></script>
    <script src="./scripts/contacts.js"></script>
    
</head>  
<body>
    <header class="topNav">
        <a href="./index.html">Home</a>
        <a href="./experience.html">Experience</a>
        <a href="./education.html">Education</a>
        <a href="#">Contact Me</a>
        <a href="./referenceList.html">References</a>
        <a href="#" id="theme">Dark/Light</a>
    </header>
    <main>
        <form id="contactForm">
            <h2>Send Me A Message!</h2>

            <label for="name">Name:</label>
            <br>
            <input type="text" id="name" name="name" required minlength="3">
            <br>
            <label for="email">Email:</label>
            <br>
            <input type="email" id="email" name="email" required>
            <br>
            <label for="phone">Phone Number:</label>
            <br>
            <input type="text" id="phone" name="phone" required minlength="10" maxlength="10">
            <br>
            <label for="comment">Message:</label>
            <br>
            <textarea id="comment" name="comment" required></textarea>
            <br>
            <input type="submit"></input>
            <input type="reset"></input>
        </form>
        
        <section>
            <h1> Contact Or Visit Me</h1>
            <h2>Try Some of My Restuarants In London</h2>
           
            <div id="map"> </div>
            
        </section>
        <script>
            function initMap(){
                const center  = {lat: 51.49841, lng: -0.09988}
                
                
                const map = new google.maps.Map(document.getElementById("map"),{
                    center: center,
                    zoom: 12
                });
                
                
                // map locations info
                const locations = [ 
                    { lat: 51.48549, lng: -0.16200, msg: "Restaurant Gordon Ramsay"},
    
                    {lat: 51.49968 , lng: -0.15677 , msg:"Pétrus" },
                     
                    {lat: 51.51021, lng: -0.11946, msg: "Savoy Grill"}, 

                    {lat: 51.51034, lng: -0.12066, msg: "The River Restaurant"},

                    {lat: 51.51264, lng: -0.15097, msg: "Lucky Cat - Mayfair"},

                    {lat: 51.50977, lng: -0.03747, msg: "Bread Street Kitchen & Bar - Limehouse"},

                    {lat: 51.51087, lng: -0.13855, msg: "Heddon Street Kitchen"},

                    {lat: 51.52397, lng: -0.07698, msg: "Pizza East - Shoreditch"},

                    {lat: 51.51042, lng: -0.12075, msg: "Restaurant 1890"},

                    {lat: 51.50349, lng: -0.010058, msg: "Street Pizza - Southwark"},

                    {lat: 36.11591, lng: -115.17333, msg: " Hell's Kitchen - Ceaser's Palace, Las Vegas"}
                    
                ]
    
                locations.forEach(loc =>{ 
                    const marker = new google.maps.Marker({
                    position: {lat: loc.lat, lng: loc.lng},
                    map: map,
                    });
    
                    const infoWindow = new google.maps.InfoWindow({
                        content: `<h4> ${loc.msg} </h4>`
                    });
    
                    marker.addListener("click", () =>{
                        infoWindow.open(map, marker)
                    });
    
                })
    
               
            }
    
        </script>

        <script
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDqG5H4vZjkM47VGI56V2BRovyKK0AfRgk&callback=initMap"></script>

    </main>
    <footer>
        <div class="footer"> Footer &copy; Copyright 2025 </div>
    </footer>
    
</body>
</html>
